<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrinkMaster · Curadoria de Coquetéis</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a0e1a; --bg-mid:#131824;
    --gold:#d4af37; --gold-bright:#f4d06f; --copper:#b87333;
    --cream:#f5efe0; --muted:#8b8fa3;
    --danger:#e85a5a; --success:#4ecdc4;
    --border:rgba(212,175,55,0.15); --border-hover:rgba(212,175,55,0.4);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:var(--bg-deep);color:var(--cream);min-height:100vh;line-height:1.6;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 15% 10%,rgba(212,175,55,0.08),transparent 45%),linear-gradient(180deg,#0a0e1a 0%,#131824 100%);z-index:-1;}
  .hidden{display:none!important;}

  .login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .login-box{background:linear-gradient(145deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:24px;padding:52px 44px;width:100%;max-width:440px;box-shadow:0 30px 80px rgba(0,0,0,0.5);}
  .login-box h1{font-family:'Playfair Display',serif;font-size:2.2em;font-weight:700;text-align:center;background:linear-gradient(135deg,var(--gold-bright),var(--copper));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
  .login-box .tagline{text-align:center;color:var(--muted);font-size:0.85em;margin-bottom:36px;letter-spacing:1px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.75em;color:var(--gold);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;font-weight:600;}
  .field input{width:100%;padding:14px 18px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:var(--cream);font-size:0.95em;outline:none;transition:all 0.3s;}
  .field input:focus{border-color:var(--gold);}
  .btn-primary{width:100%;padding:16px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--copper));color:#1a1305;font-weight:700;font-size:0.95em;cursor:pointer;transition:all 0.3s;}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(212,175,55,0.4);}
  .btn-primary:disabled{opacity:0.6;cursor:not-allowed;}
  .login-error{color:var(--danger);text-align:center;margin-top:16px;font-size:0.85em;min-height:20px;}

  #app{display:none;}
  .app-container{max-width:1440px;margin:0 auto;padding:32px 24px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;margin-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.06);}
  .brand-mark{font-family:'Playfair Display',serif;font-size:1.9em;font-weight:900;background:linear-gradient(135deg,var(--gold-bright),var(--copper));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .brand-sub{font-size:0.65em;letter-spacing:4px;text-transform:uppercase;color:var(--gold);font-weight:500;margin-top:2px;}
  .btn-pill{padding:10px 20px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);color:var(--cream);border-radius:30px;cursor:pointer;font-size:0.85em;transition:all 0.3s;}
  .btn-pill:hover{background:rgba(255,255,255,0.08);border-color:var(--gold);}
  .btn-pill.danger{color:var(--danger);}
  .hero{padding:56px 0 40px;text-align:center;}
  .hero h1{font-family:'Playfair Display',serif;font-size:3.2em;font-weight:700;margin-bottom:14px;}
  .hero h1 .gold{background:linear-gradient(135deg,var(--gold-bright),var(--copper));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-style:italic;}
  .hero p{color:var(--muted);font-size:1.05em;max-width:560px;margin:0 auto;}

  .search-wrap{max-width:620px;margin:0 auto 44px;position:relative;}
  .search-wrap input{width:100%;padding:16px 24px 16px 56px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.1);border-radius:50px;color:var(--cream);font-size:1em;outline:none;}
  .search-wrap::before{content:'⌕';position:absolute;left:22px;top:50%;transform:translateY(-50%);font-size:1.5em;color:var(--gold);}

  .drinks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px;}
  .drink-card{background:linear-gradient(145deg,rgba(255,255,255,0.05),rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.06);border-radius:20px;overflow:hidden;cursor:pointer;transition:all 0.4s;}
  .drink-card:hover{transform:translateY(-8px);border-color:var(--border-hover);box-shadow:0 24px 60px rgba(0,0,0,0.5);}
  .drink-image{height:230px;position:relative;overflow:hidden;}
  .drink-image img{width:100%;height:100%;object-fit:cover;transition:transform 0.6s;}
  .drink-card:hover .drink-image img{transform:scale(1.08);}
  .drink-image .fallback-emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:4.5em;}
  .badge-type{position:absolute;top:16px;left:16px;padding:6px 14px;border-radius:20px;font-size:0.7em;font-weight:700;text-transform:uppercase;backdrop-filter:blur(10px);}
  .badge-type.alcool{background:rgba(184,115,51,0.9);color:#fff;}
  .badge-type.sem-alcool{background:rgba(78,205,196,0.85);color:#0a0e1a;}
  .origin-tag{position:absolute;bottom:16px;left:16px;font-size:0.75em;color:var(--gold-bright);}
  .drink-info{padding:22px;}
  .drink-info h3{font-family:'Playfair Display',serif;font-size:1.45em;font-weight:600;margin-bottom:6px;}
  .drink-info .category{font-size:0.72em;color:var(--gold);text-transform:uppercase;margin-bottom:10px;}
  .drink-info .desc{font-size:0.88em;color:var(--muted);margin-bottom:14px;}

  .modal{display:none;position:fixed;inset:0;background:rgba(5,8,15,0.92);backdrop-filter:blur(12px);z-index:1000;padding:24px;overflow-y:auto;}
  .modal.active{display:flex;justify-content:center;}
  .modal-content{background:linear-gradient(160deg,#131824,#0f1219);border:1px solid var(--border-hover);border-radius:24px;max-width:820px;width:100%;margin:20px auto;overflow:hidden;}
  .modal-header{height:320px;position:relative;}
  .modal-header img{width:100%;height:100%;object-fit:cover;}
  .modal-header .fallback-emoji-lg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8em;}
  .close-btn{position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:50%;background:rgba(10,14,26,0.8);border:none;color:var(--cream);font-size:1.3em;cursor:pointer;}
  .close-btn:hover{background:var(--danger);}
  .modal-title-block{position:absolute;bottom:24px;left:36px;right:36px;}
  .modal-title-block h2{font-family:'Playfair Display',serif;font-size:2.4em;font-weight:700;}
  .modal-title-block .subtitle{color:var(--gold);font-size:0.8em;text-transform:uppercase;font-weight:600;}
  .modal-body{padding:36px;}
  .origin-box{background:linear-gradient(135deg,rgba(212,175,55,0.08),rgba(184,115,51,0.04));border-left:3px solid var(--gold);padding:18px 22px;border-radius:12px;margin-bottom:28px;}
  .origin-box h4{color:var(--gold-bright);font-size:0.75em;text-transform:uppercase;margin-bottom:8px;}
  .modal-section h3{font-family:'Playfair Display',serif;font-size:1.3em;margin-bottom:16px;border-bottom:1px solid rgba(212,175,55,0.2);padding-bottom:10px;}
  .modal-section ul{list-style:none;}
  .modal-section ul li{padding:10px 0 10px 28px;position:relative;color:#d0d2d8;}
  .modal-section ul li::before{content:'▸';position:absolute;left:8px;color:var(--gold);}
  .subst-item{background:rgba(78,205,196,0.06);border-left:3px solid var(--success);border-radius:10px;padding:14px 18px;margin-bottom:10px;}
  .subst-item .subst-title{color:var(--success);font-weight:600;margin-bottom:6px;}
  .tip-box{background:rgba(212,175,55,0.06);border-left:3px solid var(--gold);border-radius:10px;padding:16px 20px;font-style:italic;}

  @media(max-width:768px){
    .hero h1{font-size:2.2em;}
    .drinks-grid{grid-template-columns:1fr;}
    .modal-body{padding:24px 20px;}
    .modal-header{height:240px;}
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>DrinkMaster</h1>
    <p class="tagline">Acesso à sua coleção</p>
    <div class="field"><label>E-mail</label><input type="email" id="email" placeholder="seu@email.com"></div>
    <div class="field"><label>Senha</label><input type="password" id="senha" placeholder="••••••••"></div>
    <button class="btn-primary" id="btnLogin" onclick="fazerLogin()">Entrar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="app">
  <div class="app-container">
    <div class="topbar">
      <div><div class="brand-mark">DrinkMaster</div><div class="brand-sub">Curadoria de Coquetéis</div></div>
      <div class="topbar-actions"><button class="btn-pill danger" onclick="fazerLogout()">Sair</button></div>
    </div>
    <div class="hero">
      <h1>Sua coleção de <span class="gold">coquetéis</span></h1>
      <p id="welcome">Receitas selecionadas, com origem, substituições e harmonizações.</p>
    </div>
    <div class="search-wrap"><input type="text" id="searchInput" placeholder="Buscar por drink, ingrediente ou origem..."></div>
    <div class="drinks-grid" id="drinksGrid"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header" id="modalHeader">
      <button class="close-btn" onclick="closeModal()">×</button>
      <div class="modal-title-block"><div class="subtitle" id="modalCategory"></div><h2 id="modalTitle"></h2></div>
    </div>
    <div class="modal-body">
      <div class="origin-box" id="modalOrigin"></div>
      <div class="modal-section"><h3>Ingredientes</h3><ul id="modalIngredients"></ul></div>
      <div class="modal-section"><h3>Substituições</h3><div id="modalSubst"></div></div>
      <div class="modal-section"><h3>Modo de Preparo</h3><ul id="modalSteps" style="counter-reset: step;"></ul></div>
      <div class="modal-section"><h3>Dica do Bartender</h3><div class="tip-box" id="modalTip"></div></div>
    </div>
  </div>
</div>

<script>
let TOKEN = localStorage.getItem('dm_token') || null;
let NOME = localStorage.getItem('dm_nome') || '';
let DRINKS = [];

async function fazerLogin() {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const erroEl = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');
  erroEl.textContent = '';
  if (!email || !senha) { erroEl.textContent = 'Preencha e-mail e senha.'; return; }
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email, senha }) });
    const data = await r.json();
    if (!r.ok) { erroEl.textContent = data.erro || 'Credenciais inválidas.'; btn.disabled = false; btn.textContent = 'Entrar'; return; }
    TOKEN = btoa(email + ':' + senha); NOME = data.nome;
    localStorage.setItem('dm_token', TOKEN); localStorage.setItem('dm_nome', NOME);
    entrarNoApp();
  } catch { erroEl.textContent = 'Erro de conexão.'; btn.disabled = false; btn.textContent = 'Entrar'; }
}

async function entrarNoApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').style.display = 'block';
  document.getElementById('welcome').textContent = `Bem-vindo(a), ${NOME}.`;
  await carregarDados();
}

function fazerLogout() {
  TOKEN = null; NOME = ''; localStorage.removeItem('dm_token'); localStorage.removeItem('dm_nome');
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').classList.remove('hidden');
}

async function carregarDados() {
  try {
    const r = await fetch('/api/drinks', { headers: {'Authorization': `Basic ${TOKEN}`} });
    if (r.status === 401) { fazerLogout(); return; }
    DRINKS = await r.json();
    renderDrinks();
  } catch { document.getElementById('drinksGrid').innerHTML = '<p>Erro ao carregar drinks.</p>'; }
}

function renderDrinks() {
  const grid = document.getElementById('drinksGrid');
  grid.innerHTML = DRINKS.map(d => `
    <div class="drink-card" onclick="openModal(${d.id})">
      <div class="drink-image">
        <span class="fallback-emoji">${d.emoji}</span>
        <img src="${d.foto}" onerror="this.style.display='none'" onload="this.previousElementSibling.style.display='none'">
        <span class="badge-type ${d.tipo}">${d.tipo === 'alcool' ? 'Com Álcool' : 'Sem Álcool'}</span>
        <div class="origin-tag">◈ ${d.origem}</div>
      </div>
      <div class="drink-info">
        <h3>${d.nome}</h3>
        <div class="category">${d.categoria}</div>
        <div class="desc">${d.descricao}</div>
      </div>
    </div>`).join('');
}

function openModal(id) {
  const d = DRINKS.find(x => x.id === id); if (!d) return;
  document.getElementById('modalHeader').innerHTML = `<button class="close-btn" onclick="closeModal()">×</button><span class="fallback-emoji-lg">${d.emoji}</span><img src="${d.foto}" onerror="this.style.display='none'" onload="this.previousElementSibling.style.display='none'"><div class="modal-title-block"><div class="subtitle">${d.categoria}</div><h2>${d.nome}</h2></div>`;
  document.getElementById('modalOrigin').innerHTML = `<h4>Origem · ${d.origem}</h4><p>${d.historia}</p>`;
  document.getElementById('modalIngredients').innerHTML = d.ingredientes.map(i => `<li>${i}</li>`).join('');
  document.getElementById('modalSubst').innerHTML = d.substituicoes.map(s => `<div class="subst-item"><div class="subst-title">${s.ing}</div><div>Substitua por: <strong>${s.opcoes.join(', ')}</strong></div><div style="font-size:0.8em;color:#888;margin-top:5px;">${s.obs}</div></div>`).join('');
  document.getElementById('modalSteps').innerHTML = d.preparo.map((p, i) => `<li style="padding-left:0;border:none;"><strong>${i+1}.</strong> ${p}</li>`).join('');
  document.getElementById('modalTip').textContent = d.dica;
  document.getElementById('modal').classList.add('active');
}
function closeModal() { document.getElementById('modal').classList.remove('active'); }

document.getElementById('searchInput').addEventListener('input', e => {
  const b = e.target.value.toLowerCase();
  document.querySelectorAll('.drink-card').forEach(card => {
    card.style.display = card.innerText.toLowerCase().includes(b) ? 'block' : 'none';
  });
});

(async function init() {
  if (TOKEN) { try { const r = await fetch('/api/drinks', { headers: {'Authorization': `Basic ${TOKEN}`} }); if (r.ok) entrarNoApp(); else fazerLogout(); } catch { fazerLogout(); } }
})();
</script>
</body>
</html>
